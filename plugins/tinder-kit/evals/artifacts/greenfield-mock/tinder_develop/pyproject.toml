[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mock-server"
version = "0.1.0"
description = "Lightweight local HTTP API mock server driven by a mocks.json contract."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mock-server = "mock_server.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mock_server"]
