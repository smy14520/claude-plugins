[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-server"
version = "0.1.0"
description = "Lightweight local HTTP API mock server driven by a single mocks.json contract."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
mock-server = "mock_server.cli:main"

[tool.setuptools]
packages = ["mock_server"]
