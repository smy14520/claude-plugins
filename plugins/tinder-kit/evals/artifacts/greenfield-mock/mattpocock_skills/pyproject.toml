[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mock-server"
version = "0.1.0"
description = "轻量本地 HTTP API Mock 服务命令行工具：读取 mocks.json 静态契约，返回固定的模拟响应"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mock-server = "mock_server.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mock_server"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
