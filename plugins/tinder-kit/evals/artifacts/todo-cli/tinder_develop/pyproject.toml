[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-todo"
version = "0.1.0"
description = "本地 CLI Todo 工具：Tag 过滤 + 本地持久化（零第三方依赖）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
todo = "todo.cli:main"

[tool.setuptools]
packages = ["todo"]
