[project]
name = "todo-cli"
version = "0.1.0"
description = "Project-local todo CLI backed by a single ./.todos.json file."
readme = "README.md"
requires-python = ">=3.12"
# Runtime is deliberately dependency-free: argparse/json/os/pathlib only.
dependencies = []

[project.scripts]
todo = "todo_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
