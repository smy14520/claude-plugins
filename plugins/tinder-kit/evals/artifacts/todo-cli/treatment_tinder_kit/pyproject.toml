[project]
name = "todo-cli"
version = "0.1.0"
description = "单机本地 CLI Todo 工具：add / list / done / delete + 标签过滤 + 三档优先级"
requires-python = ">=3.10"
dependencies = ["typer>=0.9"]

[project.scripts]
todo = "todo_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["todo_cli"]
