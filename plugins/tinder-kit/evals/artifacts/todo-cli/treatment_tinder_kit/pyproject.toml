[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-cli"
version = "0.1.0"
description = "Local CLI todo tool with tag filtering and single-file JSON persistence"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
todo = "todo_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
