[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wiki-cli"
version = "0.1.0"
description = "本地 Markdown 个人 Wiki 只读分析内核：双链解析、反向引用、标签聚合、全文检索、体检"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
wiki-cli = "wiki_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
