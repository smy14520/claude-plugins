[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikicore"
version = "0.1.0"
description = "本地 Markdown 个人 Wiki 知识库管理内核（wiki-cli）"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wiki-cli = "wikicore.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
