[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-cli"
version = "0.1.0"
description = "Personal local Markdown wiki toolkit: wiki links, backlinks, tags, full-text search, and a vault health check. Read-only, standard library only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wiki-cli = "wikicli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
