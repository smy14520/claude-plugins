[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-cli"
version = "0.1.0"
description = "个人本地 Markdown 知识库的结构洞察工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wiki-cli = "wikicli.cli:main"

[tool.setuptools.packages.find]
include = ["wikicli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
